<!DOCTYPE html>
<html lang="th" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Brainrot AI Lab</title>

  <!-- ===== Fonts & CDN (ต้องต่อเน็ตเพื่อโหลดฟอนต์, daisyUI และ Tailwind) ===== -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Prompt:wght@400;500;600&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/daisyui@4.12.10/dist/full.min.css" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>

  <!-- ===== Stylesheet ===== -->
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- ===== Icons (SVG sprite: เรียกด้วย <use href="#i-...">) ===== -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="i-phone" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.5 2.1L8.1 9.9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.8.7a2 2 0 0 1 1.7 2z"/></symbol>
    <symbol id="i-mail" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-10 6L2 7"/></symbol>
    <symbol id="i-pin" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10c0 6-8 12-8 12S4 16 4 10a8 8 0 0 1 16 0z"/><circle cx="12" cy="10" r="3"/></symbol>
  </svg>

  <!-- ===== Skip Link ===== -->
  <a href="#app" class="skip-link" id="skip">Skip to content</a>

  <!-- ===== Header & Nav ===== -->
  <header class="site-header">
    <nav class="container-main flex items-center justify-between py-3" aria-label="Main navigation">
      <a href="#/" class="brand">Brainrot AI Lab</a>
      <ul class="hidden md:flex items-center gap-1">
        <li><a class="nav-link" data-nav="home" href="#/">Home</a></li>
        <li><a class="nav-link" data-nav="learning" href="#/learning">Learning</a></li>
        <li><a class="nav-link" data-nav="about" href="#/about">About</a></li>
        <li><a class="btn btn-primary btn-sm ml-2" data-nav="apply" href="#/apply">Apply Now</a></li>
      </ul>
      <button id="menu-btn" class="btn btn-ghost btn-square md:hidden" aria-label="Open menu" aria-expanded="false" aria-controls="mobile-menu">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>
    </nav>
    <!-- Mobile menu -->
    <div id="mobile-menu" class="container-main hidden md:hidden pb-4">
      <ul class="flex flex-col gap-1">
        <li><a class="nav-link block" data-nav="home" href="#/">Home</a></li>
        <li><a class="nav-link block" data-nav="learning" href="#/learning">Learning</a></li>
        <li><a class="nav-link block" data-nav="about" href="#/about">About</a></li>
        <li><a class="btn btn-primary w-full mt-2" data-nav="apply" href="#/apply">Apply Now</a></li>
      </ul>
    </div>
  </header>

  <!-- ===== Main (router วาดแต่ละหน้าลงที่นี่) ===== -->
  <main id="app" tabindex="-1"></main>

  <!-- ===== Footer ===== -->
  <footer class="site-footer">
    <div class="container-main py-10 grid gap-6 md:grid-cols-2">
      <div>
        <p class="brand">Brainrot AI Lab</p>
        <p class="muted mt-1">“Your Brainrot. Your Breakthrough.”</p>
      </div>
      <ul class="flex gap-5 md:justify-end items-start">
        <li><a href="#/" class="link link-hover">Home</a></li>
        <li><a href="#/learning" class="link link-hover">Learning</a></li>
        <li><a href="#/about" class="link link-hover">About</a></li>
      </ul>
    </div>
    <p class="container-main pb-8 muted text-sm">© 2026 Brainrot AI Lab. All rights reserved.</p>
  </footer>

  <!-- ===== Dialog (modal ตัวเดียวทั้งเว็บ) ===== -->
  <dialog id="dlg" class="modal modal-bottom sm:modal-middle">
    <div class="modal-box" id="dlg-body"></div>
  </dialog>

  <!-- =====================================================
       TEMPLATES: โครงหน้าทั้งหมดอยู่ตรงนี้ JS แค่ clone แล้วเติมข้อมูล
       แบ่งเป็น 3 กลุ่ม: Components → Pages → Dialog contents
       ===================================================== -->

  <!-- ########## Components (การ์ดที่ใช้ซ้ำ) ########## -->

  <!-- ===== Template: Job Card ===== -->
  <template id="tpl-job-card">
    <article class="card-box item-card">
      <img class="card-img js-img" width="480" height="270" alt="" loading="lazy">
      <div class="grow">
        <div class="flex flex-wrap gap-2 mb-3">
          <span class="badge badge-outline" data-slot="mode"></span>
          <span class="badge badge-ghost" data-slot="level"></span>
        </div>
        <h3 data-slot="title"></h3>
        <p class="company" data-slot="company"></p>
        <p class="salary" data-slot="salary"></p>
        <p class="muted" data-slot="short"></p>
      </div>
      <div class="actions">
        <a class="btn btn-outline btn-sm js-detail">View Details</a>
        <a class="btn btn-primary btn-sm js-apply">Apply Now</a>
      </div>
    </article>
  </template>

  <!-- ===== Template: Course Card ===== -->
  <template id="tpl-course-card">
    <article class="card-box item-card">
      <img class="card-img js-img" width="480" height="270" alt="" loading="lazy">
      <div class="grow">
        <div class="flex flex-wrap gap-2 mb-2">
          <span class="badge badge-outline" data-slot="category"></span>
          <span class="badge badge-ghost" data-slot="level"></span>
        </div>
        <h3 data-slot="name"></h3>
        <p class="company" data-slot="provider"></p>
        <p class="text-sm mt-2"><strong>Duration:</strong> <span data-slot="duration"></span></p>
        <p class="text-sm"><strong>Price:</strong> <span data-slot="price"></span></p>
        <div class="flex flex-wrap gap-2 mt-3 js-dims"></div>
      </div>
      <div class="actions">
        <a class="btn btn-outline btn-sm js-detail">View Details</a>
        <span class="badge badge-success badge-lg text-white js-registered" hidden>Registered</span>
      </div>
    </article>
  </template>

  <!-- ===== Template: Highlight Card ===== -->
  <template id="tpl-highlight-card">
    <div class="card-box">
      <div class="icon-bubble js-icon" aria-hidden="true"></div>
      <h3 data-slot="title"></h3>
      <p class="muted text-sm" data-slot="text"></p>
    </div>
  </template>

  <!-- ########## Pages (โครงแต่ละหน้า) ########## -->

  <!-- ===== Template: Home ===== -->
  <template id="tpl-home">
    <!-- Hero -->
    <section class="hero container-main">
      <div class="hero-box">
        <h1>Find Your Future in AI &amp; Digital.</h1>
        <p class="lead">Explore career opportunities, discover your strengths, and level up your skills with Brainrot AI Lab.</p>
        <div class="flex flex-wrap gap-3">
          <button class="btn btn-primary" data-scroll="jobs">Explore Jobs</button>
          <a class="btn btn-outline" href="#/learning">Start Learning</a>
          <a class="btn btn-accent" href="#/apply">Apply Now</a>
        </div>
      </div>
    </section>

    <!-- Career Opportunities -->
    <section id="jobs" class="section container-main" aria-labelledby="jobs-title">
      <h2 id="jobs-title">Career Opportunities</h2>
      <p class="muted mb-6">Find the role that matches your skills and ambitions.</p>
      <div class="grid-cards" id="job-list"></div>
    </section>

    <!-- Skill Development -->
    <section class="section container-main" aria-labelledby="skills-title">
      <h2 id="skills-title">Skill Development</h2>
      <p class="muted mb-6">เริ่มเรียนรู้ทักษะ AI ก่อนสมัครงาน</p>
      <div class="grid-cards" id="home-courses"></div>
      <div class="mt-6"><a href="#/learning" class="btn btn-primary">Explore All Courses</a></div>
    </section>

    <!-- Why Brainrot AI Lab -->
    <section class="section container-main" aria-labelledby="why-title">
      <h2 id="why-title" class="mb-6">Why Brainrot AI Lab</h2>
      <div class="grid-cards" id="home-highlights"></div>
    </section>
  </template>

  <!-- ===== Template: Job Detail ===== -->
  <template id="tpl-job-detail">
    <section class="section container-main detail-wrap">
      <button class="btn btn-ghost btn-sm back-btn" data-back="/">← กลับ</button>
      <article class="card-box">
        <img class="detail-img js-img" width="480" height="270" alt="">
        <h1 class="detail-title" data-slot="title"></h1>
        <p class="company mt-1" data-slot="company"></p>
        <div class="meta-row">
          <span class="badge badge-outline" data-slot="type"></span>
          <span class="badge badge-outline" data-slot="mode"></span>
          <span class="badge badge-ghost" data-slot="level"></span>
        </div>
        <p class="salary">Salary: <span data-slot="salary"></span></p>
        <div class="detail-block"><h2>Job Description</h2><p data-slot="desc"></p></div>
        <div class="detail-block"><h2>Key Responsibilities</h2><ul class="detail-list js-duties"></ul></div>
        <div class="detail-block"><h2>Qualifications</h2><ul class="detail-list js-quals"></ul></div>
        <div class="detail-block"><h2>Benefits</h2><ul class="detail-list js-benefits"></ul></div>
        <div class="mt-8"><a class="btn btn-primary js-apply">Apply Now</a></div>
      </article>
    </section>
  </template>

  <!-- ===== Template: Learning ===== -->
  <template id="tpl-learning">
    <section class="section container-main">
      <h1>AI Learning Hub</h1>
      <p class="muted mt-2 mb-6">Learn New Skills. Build Your Future.</p>

      <div class="field mb-4" style="max-width:480px">
        <label class="lbl" for="course-search">Search courses</label>
        <input id="course-search" type="search" class="input" placeholder="เช่น Prompt, Azure, Deep Learning">
      </div>
      <div class="flex flex-wrap gap-2 mb-3" id="cat-chips" role="group" aria-label="Filter by type">
        <button type="button" class="chip" data-cat="All">All</button>
        <button type="button" class="chip" data-cat="Certificate">Certificate</button>
        <button type="button" class="chip" data-cat="Workshop">Workshop</button>
        <button type="button" class="chip" data-cat="Online Course">Online Course</button>
        <button type="button" class="chip" data-cat="Seminar">Seminar</button>
      </div>
      <div class="field mb-5" style="max-width:240px">
        <label class="lbl" for="level-filter">Level</label>
        <select id="level-filter" class="select">
          <option value="All">All levels</option>
          <option value="Beginner">Beginner</option>
          <option value="Intermediate">Intermediate</option>
          <option value="Advanced">Advanced</option>
        </select>
      </div>

      <p id="course-count" class="muted text-sm mb-3" aria-live="polite"></p>
      <div class="grid-cards" id="course-grid"></div>
      <div id="course-empty" class="card-box text-center" hidden>No courses found. Try another search or filter.</div>

      <!-- AI Competency Framework -->
      <div class="mt-14">
        <h2>AI Competency Framework</h2>
        <p class="muted mb-6">กรอบสมรรถนะ 4 มิติที่ออกแบบสำหรับแพลตฟอร์มนี้ ใช้จัดหมวดหมู่ทักษะภายในเว็บไซต์ ไม่ใช่การรับรองอย่างเป็นทางการจากหน่วยงานภายนอก</p>
        <div class="grid-cards" style="grid-template-columns:repeat(auto-fit,minmax(240px,1fr))">
          <div class="card-box"><h3>AI Literacy</h3><ul class="detail-list text-sm mt-2"><li>เข้าใจพื้นฐาน AI, Machine Learning และ Generative AI</li><li>รู้จักความสามารถและข้อจำกัดของ AI</li></ul></div>
          <div class="card-box"><h3>AI Application</h3><ul class="detail-list text-sm mt-2"><li>สามารถใช้ AI ช่วยทำงาน วิเคราะห์ข้อมูล และแก้ปัญหา</li><li>สามารถเลือกเครื่องมือ AI ให้เหมาะกับงาน</li></ul></div>
          <div class="card-box"><h3>AI Creation &amp; Innovation</h3><ul class="detail-list text-sm mt-2"><li>สามารถสร้างต้นแบบหรือพัฒนา AI Application</li><li>ใช้ความคิดสร้างสรรค์ในการประยุกต์ใช้ AI</li></ul></div>
          <div class="card-box"><h3>Responsible AI &amp; Ethics</h3><ul class="detail-list text-sm mt-2"><li>เข้าใจความเป็นส่วนตัว ความปลอดภัย และอคติของ AI</li><li>ใช้ AI อย่างรับผิดชอบและตรวจสอบผลลัพธ์ก่อนใช้งาน</li></ul></div>
        </div>
      </div>
    </section>
  </template>

  <!-- ===== Template: Course Detail ===== -->
  <template id="tpl-course-detail">
    <section class="section container-main detail-wrap">
      <button class="btn btn-ghost btn-sm back-btn" data-back="/learning">← กลับ</button>
      <article class="card-box">
        <img class="detail-img js-img" width="480" height="270" alt="">
        <h1 class="detail-title" data-slot="name"></h1>
        <div class="meta-row">
          <span class="badge badge-outline" data-slot="category"></span>
          <span class="badge badge-ghost" data-slot="level"></span>
        </div>
        <div class="detail-block"><h2>Description</h2><p data-slot="desc"></p></div>
        <div class="detail-block"><h2>Learning Topics</h2><ul class="detail-list js-topics"></ul></div>
        <div class="detail-block">
          <h2>Course Information</h2>
          <dl class="grid gap-3">
            <div><dt class="font-semibold">Provider</dt><dd class="muted" data-slot="provider"></dd></div>
            <div><dt class="font-semibold">Duration</dt><dd class="muted" data-slot="duration"></dd></div>
            <div><dt class="font-semibold">Price</dt><dd class="muted" data-slot="price"></dd></div>
            <div><dt class="font-semibold">Target Audience</dt><dd class="muted" data-slot="audience"></dd></div>
            <div><dt class="font-semibold">Required Skills</dt><dd class="muted" data-slot="skills"></dd></div>
            <div><dt class="font-semibold">Certificate Information</dt><dd class="muted" data-slot="cert"></dd></div>
          </dl>
        </div>
        <div class="detail-block"><h2>AI Competency Dimensions</h2><div class="flex flex-wrap gap-2 js-dims"></div></div>
        <div class="detail-block"><h2>Registration Status</h2><p data-slot="status"></p></div>
        <div class="mt-6"><button class="btn btn-primary js-register">Register Now</button></div>
      </article>
    </section>
  </template>

  <!-- ===== Template: About ===== -->
  <template id="tpl-about">
    <section class="section container-main">
      <h1>About Brainrot AI Lab</h1>
      <p class="muted mt-2">“Your Brainrot. Your Breakthrough.”</p>

      <!-- About Us -->
      <div class="card-box mt-6" style="max-width:820px">
        <h2 class="mb-3">About Us</h2>
        <p class="mb-3">Brainrot AI Lab คือแพลตฟอร์มที่มุ่งเชื่อมโยงคนรุ่นใหม่เข้ากับโอกาสในการทำงานด้าน Artificial Intelligence (AI) และ Digital Technology เราเชื่อว่าทุกคนสามารถพัฒนาตัวเองได้ แม้จะยังไม่มีประสบการณ์หรือทักษะที่โดดเด่นในวันนี้ก็ตาม</p>
        <p class="mb-3">เราสร้างพื้นที่ที่รวบรวมตำแหน่งงานด้านเทคโนโลยี หลักสูตรอบรม สัมมนา และการพัฒนาทักษะที่จำเป็นต่อการทำงาน พร้อมระบบประเมินสมรรถนะเบื้องต้น เพื่อช่วยให้ผู้สมัครเข้าใจจุดแข็งของตัวเองและค้นหาเส้นทางอาชีพที่เหมาะสม</p>
        <p>เป้าหมายของเราไม่ใช่แค่การช่วยให้คุณได้งาน แต่คือการช่วยให้คุณพร้อมสำหรับงานนั้นจริง ๆ เพราะในโลกเทคโนโลยีที่เปลี่ยนแปลงอยู่เสมอ คนที่พร้อมเรียนรู้และปรับตัวคือคนที่มีโอกาสเติบโตได้ในระยะยาว</p>
      </div>

      <!-- Vision & Mission -->
      <div class="grid-cards mt-8" style="grid-template-columns:repeat(auto-fit,minmax(280px,1fr))">
        <div class="card-box">
          <h2 class="mb-2" style="font-size:1.3rem">Vision</h2>
          <p class="font-semibold">“To make AI and digital career opportunities more accessible to everyone.”</p>
          <p class="muted mt-2">ทำให้โอกาสในการเรียนรู้และทำงานด้าน AI และดิจิทัลเข้าถึงได้ง่ายสำหรับทุกคน</p>
        </div>
        <div class="card-box">
          <h2 class="mb-2" style="font-size:1.3rem">Mission</h2>
          <ul class="detail-list">
            <li>รวบรวมตำแหน่งงานด้าน AI และ Digital</li>
            <li>สนับสนุนการเรียนรู้ผ่านหลักสูตรอบรมและสัมมนา</li>
            <li>พัฒนาระบบประเมินสมรรถนะเพื่อค้นหาทักษะที่ควรพัฒนา</li>
            <li>ส่งเสริมการสร้าง Portfolio และผลงานจริง</li>
            <li>สร้างสังคมการเรียนรู้ที่เป็นมิตรกับมือใหม่</li>
          </ul>
        </div>
      </div>

      <!-- Company Highlights -->
      <h2 class="mt-12 mb-5">Company Highlights</h2>
      <div class="grid-cards" id="about-highlights"></div>

      <!-- Contact Information -->
      <h2 class="mt-12 mb-5">Contact Information</h2>
      <div class="grid-cards" style="grid-template-columns:repeat(auto-fit,minmax(260px,1fr))">
        <div class="card-box">
          <h3 class="mb-2">Company Address</h3>
          <p class="contact-link"><svg width="20" height="20" aria-hidden="true"><use href="#i-pin"/></svg><span>เลขที่ 9/1 หมู่ 5 ถนนพหลโยธิน ตำบลคลองหนึ่ง อำเภอคลองหลวง จังหวัดปทุมธานี 12120</span></p>
        </div>
        <div class="card-box">
          <h3 class="mb-2">Contact Person 1</h3>
          <p class="font-semibold mb-2">เอกกร เรืองจิรเดช</p>
          <p class="contact-link mb-1"><svg width="20" height="20" aria-hidden="true"><use href="#i-phone"/></svg><a class="link link-hover" href="tel:0989814983">0989814983</a></p>
          <p class="contact-link"><svg width="20" height="20" aria-hidden="true"><use href="#i-mail"/></svg><a class="link link-hover" href="mailto:akorn.ruan@bumail.net">akorn.ruan@bumail.net</a></p>
        </div>
        <div class="card-box">
          <h3 class="mb-2">Contact Person 2</h3>
          <p class="font-semibold mb-2">ณธิดา จิตต์ชัยวิสุทธิ์</p>
          <p class="contact-link mb-1"><svg width="20" height="20" aria-hidden="true"><use href="#i-phone"/></svg><a class="link link-hover" href="tel:0999999999">0999999999</a></p>
          <p class="contact-link"><svg width="20" height="20" aria-hidden="true"><use href="#i-mail"/></svg><a class="link link-hover" href="mailto:natida.jitc@bumail.net">natida.jitc@bumail.net</a></p>
        </div>
      </div>
    </section>
  </template>

  <!-- ===== Template: Application Form ===== -->
  <template id="tpl-apply">
    <section class="section container-main">
      <button class="btn btn-ghost btn-sm back-btn" data-back="/">← กลับ</button>
      <div class="card-box form-card">
        <h1 class="detail-title">Job Application Form</h1>
        <p class="muted mt-1 mb-6">Take the next step in your AI &amp; Digital career.</p>

        <form id="apply-form" novalidate class="grid gap-5">
          <!-- ชื่อ -->
          <div class="form-grid two">
            <div class="field" data-field="firstName">
              <label class="lbl" for="firstName">First Name *</label>
              <input id="firstName" name="firstName" type="text" class="input" placeholder="First Name" autocomplete="given-name" aria-describedby="err-firstName">
              <p class="field-error" id="err-firstName" role="alert"></p>
            </div>
            <div class="field" data-field="lastName">
              <label class="lbl" for="lastName">Last Name *</label>
              <input id="lastName" name="lastName" type="text" class="input" placeholder="Last Name" autocomplete="family-name" aria-describedby="err-lastName">
              <p class="field-error" id="err-lastName" role="alert"></p>
            </div>
          </div>

          <!-- ติดต่อ -->
          <div class="form-grid two">
            <div class="field" data-field="phone">
              <label class="lbl" for="phone">Phone Number *</label>
              <input id="phone" name="phone" type="tel" inputmode="numeric" maxlength="10" placeholder="0812345678" class="input" autocomplete="tel" aria-describedby="err-phone">
              <p class="field-error" id="err-phone" role="alert"></p>
            </div>
            <div class="field" data-field="email">
              <label class="lbl" for="email">Email (Gmail only) *</label>
              <input id="email" name="email" type="email" placeholder="example@gmail.com" class="input" autocomplete="email" aria-describedby="err-email">
              <p class="field-error" id="err-email" role="alert"></p>
            </div>
          </div>

          <!-- ที่อยู่ -->
          <div class="field" data-field="address">
            <label class="lbl" for="address">Address *</label>
            <textarea id="address" name="address" rows="3" class="textarea" placeholder="Address" aria-describedby="err-address"></textarea>
            <p class="field-error" id="err-address" role="alert"></p>
          </div>

          <!-- Resume -->
          <div class="field" data-field="resume">
            <span class="lbl" id="resume-label">Resume *</span>
            <div class="upload-box">
              <input type="file" id="resume-input" name="resume" accept=".pdf,.doc,.docx" class="hidden" aria-labelledby="resume-label" aria-describedby="err-resume">
              <button type="button" class="btn btn-outline btn-sm" id="upload-btn">Upload Resume</button>
              <span id="file-name" class="muted text-sm">PDF, DOC or DOCX, max 5 MB</span>
              <button type="button" class="btn btn-ghost btn-sm hidden" id="remove-file">Remove</button>
            </div>
            <p class="field-error" id="err-resume" role="alert"></p>
          </div>

          <!-- เพศ -->
          <fieldset class="field" data-field="gender">
            <legend>Gender *</legend>
            <div class="flex flex-wrap gap-3">
              <label class="box-pick"><input type="radio" name="gender" value="Male" class="radio radio-sage"><span>Male</span></label>
              <label class="box-pick"><input type="radio" name="gender" value="Female" class="radio radio-sage"><span>Female</span></label>
              <label class="box-pick"><input type="radio" name="gender" value="Other" class="radio radio-sage"><span>Other</span></label>
            </div>
            <p class="field-error" id="err-gender" role="alert"></p>
          </fieldset>

          <!-- ระดับสมรรถนะ AI -->
          <fieldset class="field" data-field="level">
            <legend>AI Competency Level *</legend>
            <div class="grid gap-2">
              <label class="box-pick"><input type="radio" name="level" value="Beginner" class="radio radio-sage mt-1"><span><strong>Beginner</strong> — ระดับเริ่มต้น<br><span class="muted text-sm">ผู้เริ่มต้นเรียนรู้ AI และ Digital Technology</span></span></label>
              <label class="box-pick"><input type="radio" name="level" value="Pioneer" class="radio radio-sage mt-1"><span><strong>Pioneer</strong> — ระดับผู้บุกเบิก<br><span class="muted text-sm">ผู้ที่สามารถนำ AI ไปทดลองประยุกต์ใช้กับงานได้</span></span></label>
              <label class="box-pick"><input type="radio" name="level" value="Innovator" class="radio radio-sage mt-1"><span><strong>Innovator</strong> — ระดับผู้สร้างสรรค์สิ่งใหม่<br><span class="muted text-sm">ผู้ที่สามารถออกแบบหรือสร้างโซลูชันใหม่ด้วย AI ได้</span></span></label>
            </div>
            <p class="muted text-xs mt-2">ระดับนี้เป็นการจัดกลุ่มสำหรับเว็บไซต์ ไม่ใช่ใบรับรองหรือระดับมาตรฐานสากลอย่างเป็นทางการ</p>
            <p class="field-error" id="err-level" role="alert"></p>
          </fieldset>

          <!-- ตำแหน่งที่สมัคร (JS เติมตัวเลือกจาก data.js) -->
          <div class="field" data-field="position">
            <label class="lbl" for="position">Position Applying For *</label>
            <select id="position" name="position" class="select" aria-describedby="err-position">
              <option value="">Select a position</option>
            </select>
            <p class="field-error" id="err-position" role="alert"></p>
          </div>

          <!-- ความยินยอม -->
          <div class="field" data-field="consent">
            <label class="box-pick">
              <input type="checkbox" name="consent" class="checkbox checkbox-sage mt-1" aria-describedby="err-consent">
              <span>I consent to the processing of my personal data for recruitment purposes in accordance with the applicable privacy policy.
                <button type="button" class="link" id="privacy-link" style="color:var(--coffee)">Privacy Policy</button></span>
            </label>
            <p class="field-error" id="err-consent" role="alert"></p>
          </div>

          <!-- ปุ่ม -->
          <div class="flex flex-wrap gap-3">
            <button type="submit" class="btn btn-primary" id="submit-btn">Submit Application</button>
            <button type="button" class="btn btn-ghost" id="reset-btn">Reset Form</button>
          </div>
        </form>
      </div>
    </section>
  </template>

  <!-- ===== Template: Not Found ===== -->
  <template id="tpl-notfound">
    <section class="section container-main text-center">
      <h1>Page not found</h1>
      <p class="muted my-4">ไม่พบหน้าที่คุณต้องการ</p>
      <a href="#/" class="btn btn-primary">Back to Home</a>
    </section>
  </template>

  <!-- ########## Dialog contents (เนื้อหาใน modal) ########## -->

  <!-- ===== Template: Privacy Policy ===== -->
  <template id="tpl-privacy">
    <h3 class="text-lg mb-3">Privacy Policy</h3>
    <div class="grid gap-3 text-sm">
      <p><strong>วัตถุประสงค์:</strong> เพื่อใช้พิจารณาใบสมัครงานและติดต่อกลับผู้สมัคร</p>
      <p><strong>ข้อมูลที่เก็บ:</strong> ชื่อ-นามสกุล เบอร์โทรศัพท์ อีเมล ที่อยู่ ไฟล์ Resume เพศ ระดับสมรรถนะด้าน AI และตำแหน่งที่สมัคร</p>
      <p><strong>ผู้มีสิทธิเข้าถึง:</strong> เฉพาะเจ้าหน้าที่สรรหาบุคลากรที่ได้รับมอบหมาย</p>
      <p><strong>ระยะเวลาจัดเก็บ:</strong> ตามที่บริษัทกำหนดในนโยบายการเก็บรักษาข้อมูล</p>
      <p><strong>การรักษาความปลอดภัย:</strong> จำกัดสิทธิ์การเข้าถึงข้อมูลและใช้มาตรการป้องกันที่เหมาะสม</p>
      <p><strong>ช่องทางติดต่อผู้ดูแลข้อมูล:</strong> ดูรายชื่อผู้ติดต่อที่หน้า <a class="link" href="#/about">About</a></p>
    </div>
    <div class="modal-action"><button class="btn btn-primary" data-close>Close</button></div>
  </template>

  <!-- ===== Template: Application Success ===== -->
  <template id="tpl-app-success">
    <div class="text-center">
      <div class="success-mark" aria-hidden="true">✓</div>
      <h3 class="text-xl">Application Submitted Successfully!</h3>
      <p class="muted my-3">Thank you for applying to Brainrot AI Lab.</p>
      <div class="modal-action justify-center flex-wrap">
        <a href="#/" class="btn btn-primary">Back to Home</a>
        <a href="#/learning" class="btn btn-outline">View Learning Courses</a>
      </div>
    </div>
  </template>

  <!-- ===== Template: Confirm Registration ===== -->
  <template id="tpl-confirm-reg">
    <h3 class="text-lg">Confirm Registration</h3>
    <dl class="my-4 grid gap-2">
      <div><dt class="font-semibold">Course</dt><dd data-slot="name"></dd></div>
      <div><dt class="font-semibold">Price</dt><dd data-slot="price"></dd></div>
      <div><dt class="font-semibold">Duration</dt><dd data-slot="duration"></dd></div>
    </dl>
    <div class="modal-action">
      <button class="btn btn-ghost" data-close>Cancel</button>
      <button class="btn btn-primary js-confirm">Confirm Registration</button>
    </div>
  </template>

  <!-- ===== Template: Registration Success ===== -->
  <template id="tpl-reg-success">
    <div class="text-center">
      <div class="success-mark" aria-hidden="true">✓</div>
      <h3 class="text-xl">Registration Successful!</h3>
      <p class="muted my-3">Thank you for registering for this course.</p>
      <div class="modal-action justify-center"><a href="#/learning" class="btn btn-primary">Back to Learning</a></div>
    </div>
  </template>

  <!-- ===== Scripts (ลำดับสำคัญ: data → app) ===== -->
  <script src="js/data.js" defer></script>
  <script src="js/app.js" defer></script>
</body>
</html>
